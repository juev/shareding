name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore release key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.SHAREDING_RELEASE_KEYSTORE_B64 }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_B64" ]]; then
            echo 'Release keystore secret is missing' >&2
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/shareding-release.jks"
          chmod 600 "$RUNNER_TEMP/shareding-release.jks"

      - name: Build signed APK and run checks
        env:
          SHAREDING_RELEASE_KEYSTORE: ${{ runner.temp }}/shareding-release.jks
          SHAREDING_RELEASE_PASSWORD: ${{ secrets.SHAREDING_RELEASE_PASSWORD }}
        run: |
          if [[ -z "$SHAREDING_RELEASE_PASSWORD" ]]; then
            echo 'Release password secret is missing' >&2
            exit 1
          fi
          ./gradlew --no-daemon assembleRelease testDebugUnitTest lintDebug

      - name: Verify APK and prepare assets
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          signer_digest="$("$build_tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          if [[ "$signer_digest" != '3693ca80cbfc0d7b30a403f49c25637d78b12d1a196bdec398f413fb56a8657e' ]]; then
            echo 'APK signing certificate does not match existing releases' >&2
            exit 1
          fi

          package_line="$("$build_tools/aapt" dump badging "$apk" | sed -n '1p')"
          if [[ "$package_line" != *"name='org.evsyukov.shareding'"* ]]; then
            echo 'Unexpected APK package name' >&2
            exit 1
          fi
          package_version="$(printf '%s\n' "$package_line" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          if [[ -z "$package_version" ]]; then
            echo 'APK version name is missing' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$package_version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo 'Tag does not match APK version name' >&2
            exit 1
          fi

          asset_name="ShareDing-v${package_version}.apk"
          asset_dir="$RUNNER_TEMP/shareding-release"
          mkdir -p "$asset_dir"
          cp "$apk" "$asset_dir/$asset_name"
          (cd "$asset_dir" && sha256sum "$asset_name" > "$asset_name.sha256")
          echo "Verified signed APK: $asset_name"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          apk="$RUNNER_TEMP/shareding-release/ShareDing-${tag}.apk"
          checksum="$apk.sha256"
          release_flags=()
          if [[ "$tag" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$checksum" --clobber
          else
            gh release create "$tag" "$apk" "$checksum" --verify-tag \
              --title "ShareDing ${tag#v}" --generate-notes "${release_flags[@]}"
          fi
